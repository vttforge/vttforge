name: Publish to npm

# Runs when the Version PR from changesets lands on main (its squash commit
# keeps the PR title), on a manual dispatch, or on a v* tag. Publishing uses
# npm Trusted Publishing (OIDC): no NPM_TOKEN, no --provenance flag, both
# handled server-side. Per-package npmjs.com Trusted Publisher config must
# point at this repo + this workflow filename.
#
# The tags this workflow pushes are `<package>@<version>`, created after the
# publish, so a tag can never be what starts a release; the merge is.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  # write, not read: this workflow pushes the version tags and opens the
  # GitHub releases. Nothing else did — changesets/action creates those as
  # part of its publish step, and publishing moved here for OIDC without the
  # tagging coming along.
  contents: write
  id-token: write # required for npm OIDC trusted publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify + publish (OIDC)
    # On a push to main, only the merged Version PR publishes.
    # scripts/publish-packages.mjs skips versions already on the registry,
    # so a re-run is harmless.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      startsWith(github.event.head_commit.message, 'chore(release): version packages')
    # GitHub-hosted on purpose, unlike CI. npm attaches sigstore provenance to
    # public packages and refuses it from a self-hosted runner — only
    # github-hosted ones are accepted. This surfaced the moment the repository
    # went public: while it was private, pnpm could not determine visibility
    # and skipped provenance, so the self-hosted runner worked by accident.
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Configure npm registry (OIDC handles auth)
        run: |
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc

      - name: Install
        run: bun install --frozen-lockfile

      # The release PR is generated by the changesets bot pushing with
      # GITHUB_TOKEN, and GitHub does not trigger workflows on its own token —
      # so that PR never gets CI. Publishing is therefore the only gate the
      # released code passes through, and it has to be the full one.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Publint
        run: bun run publint

      # bun publish itself doesn't support npm OIDC trusted publishing yet
      # (oven-sh/bun#15601, open). bunx fetches a real npm CLI (>=11.5.1,
      # required for OIDC) with no extra setup step; bun pm pack (inside
      # the script) resolves this repo's catalog:/workspace: protocol
      # entries into real semver first, since plain npm can't. Skips
      # versions already on the registry, so a re-run is harmless.
      - name: Publish
        run: node scripts/publish-packages.mjs

      # `changeset git-tag` reads the versions already in package.json and creates
      # one git tag per package that does not have one yet. Safe to re-run: it
      # skips tags that already exist.
      - name: Tag the published versions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          bunx changeset git-tag
          git push --tags

      # One GitHub release per new tag, with the notes taken from that
      # package's CHANGELOG section for that version — the same text the
      # changeset author wrote, rather than a generated diff summary.
      - name: Open a GitHub release per tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/create-releases.mjs
