name: Publish to npm

# Tagged release (v*) triggers publish under npm Trusted Publishing (OIDC).
# No NPM_TOKEN, no --provenance flag — both handled server-side under OIDC.
# Per-package npmjs.com Trusted Publisher config must point at this repo +
# this workflow filename.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  # write, not read: this workflow pushes the version tags and opens the
  # GitHub releases. Nothing else did — changesets/action creates those as
  # part of its publish step, and publishing moved here for OIDC without the
  # tagging coming along.
  contents: write
  id-token: write # required for npm OIDC trusted publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify + publish (OIDC)
    # GitHub-hosted on purpose, unlike CI. npm attaches sigstore provenance to
    # public packages and refuses it from a self-hosted runner — only
    # github-hosted ones are accepted. This surfaced the moment the repository
    # went public: while it was private, pnpm could not determine visibility
    # and skipped provenance, so the self-hosted runner worked by accident.
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'

      - name: Activate pnpm via Corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack install -g pnpm@11.25.0

      - name: Configure npm registry (OIDC handles auth)
        run: |
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc

      - name: Install
        run: pnpm install --frozen-lockfile --force

      # The release PR is generated by the changesets bot pushing with
      # GITHUB_TOKEN, and GitHub does not trigger workflows on its own token —
      # so that PR never gets CI. Publishing is therefore the only gate the
      # released code passes through, and it has to be the full one.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publint
        run: pnpm publint

      # OIDC trusted publishing requires npm CLI >= 11.5.1.
      # Corepack-managed pnpm 10.33+ ships a compatible npm bundle.
      - name: Publish
        run: pnpm publish -r --access public --no-git-checks

      # `changeset git-tag` reads the versions already in package.json and creates
      # one git tag per package that does not have one yet. Safe to re-run: it
      # skips tags that already exist.
      - name: Tag the published versions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          pnpm exec changeset git-tag
          git push --tags

      # One GitHub release per new tag, with the notes taken from that
      # package's CHANGELOG section for that version — the same text the
      # changeset author wrote, rather than a generated diff summary.
      - name: Open a GitHub release per tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/create-releases.mjs
