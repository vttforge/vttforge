name: Changesets

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Open Version PR
    runs-on: [self-hosted, linux, x64, gcp]
    if: github.repository == 'vttforge/vttforge'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate pnpm via Corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack install -g pnpm@10.33.4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create Version PR (publishing happens in publish.yml under OIDC)
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
