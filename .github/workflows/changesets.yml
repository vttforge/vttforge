name: Changesets

on:
  push:
    branches: [main]

# Required so the action can open the Version PR / push commits.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Open Version PR / release
    runs-on: ubuntu-latest
    # Skip the action's own release commits to avoid loops
    if: github.repository == 'vttforge/vttforge'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create Version PR (no publishing here — publish.yml handles that under OIDC)
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
