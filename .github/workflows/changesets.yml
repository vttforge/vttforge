name: Changesets

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Open Version PR
    runs-on: [self-hosted, linux, x64, gcp]
    if: github.repository == 'vttforge/vttforge'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        run: bun install --frozen-lockfile --force

      - name: Create Version PR (merging it runs publish.yml under OIDC)
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          version-script: bun run changeset:version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
