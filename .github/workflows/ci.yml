name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Self-hosted GCP runner from fcsouza/infra (gcp/runners/).
# Pre-installed: Node 22.11, Bun 1.3.14, gh CLI, actionlint, Chrome, Playwright.
# Corepack ships with Node — we activate pnpm@10.33.4 via `corepack prepare`.
# Node 24 matrix testing is parked until the runner image ships Node 24
# (plans/to-revise.md).

jobs:
  lint:
    name: Lint (biome + syncpack)
    runs-on: [self-hosted, linux, x64, gcp]
    steps:
      - uses: actions/checkout@v4

      - name: Activate pnpm via Corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack install -g pnpm@10.33.4

      - name: Install
        run: pnpm install --frozen-lockfile --force

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: [self-hosted, linux, x64, gcp]
    steps:
      - uses: actions/checkout@v4

      - name: Activate pnpm via Corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack install -g pnpm@10.33.4

      - name: Install
        run: pnpm install --frozen-lockfile --force

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: [self-hosted, linux, x64, gcp]
    steps:
      - uses: actions/checkout@v4

      - name: Activate pnpm via Corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack install -g pnpm@10.33.4

      - name: Install
        run: pnpm install --frozen-lockfile --force

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: [self-hosted, linux, x64, gcp]
    steps:
      - uses: actions/checkout@v4

      - name: Activate pnpm via Corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack install -g pnpm@10.33.4

      - name: Install
        run: pnpm install --frozen-lockfile --force

      - name: Build
        run: pnpm build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/*/dist/**
            !packages/styles/dist
          if-no-files-found: warn
          retention-days: 7

  package-quality:
    name: Package quality (publint + attw)
    runs-on: [self-hosted, linux, x64, gcp]
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Activate pnpm via Corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack install -g pnpm@10.33.4

      - name: Install
        run: pnpm install --frozen-lockfile --force

      - name: Build
        run: pnpm build

      - name: Publint
        run: pnpm publint

      - name: Are The Types Wrong (currently stubbed — see plans/to-revise.md)
        run: pnpm attw

  knip:
    name: Knip (dead-code detection, non-blocking)
    runs-on: [self-hosted, linux, x64, gcp]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Activate pnpm via Corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack install -g pnpm@10.33.4

      - name: Install
        run: pnpm install --frozen-lockfile --force

      - name: Knip
        env:
          # Runner image ships Node 22.11; oxc-parser (used by knip) has CJS
          # that require()s ESM, which Node only enables by default from 22.12
          # onwards. Drop this once the infra runner image bumps Node ≥ 22.14
          # (matches our engines.node floor). See plans/to-revise.md.
          NODE_OPTIONS: '--experimental-require-module'
        run: pnpm knip
