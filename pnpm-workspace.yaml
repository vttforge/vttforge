packages:
  - 'packages/*'
  - 'examples/*'
  - 'apps/*'

catalog:
  vitepress: ^1.6.4
  pagefind: ^1.5.2
  '@arethetypeswrong/cli': ^0.18.5
  '@biomejs/biome': ^2.5.11
  '@changesets/cli': ^3.0.1
  '@changesets/get-release-plan': ^4.0.16
  '@clack/prompts': ^1.7.0
  '@types/archiver': ^8.0.0
  '@types/node': ^26.4.0
  archiver: ^8.0.0
  citty: ^0.2.2
  happy-dom: ^20.12.0
  knip: ^6.34.0
  lefthook: ^2.1.12
  publint: ^0.3.24
  semver: ^7.8.5
  style-dictionary: ^5.5.2
  syncpack: ^15.3.3
  tsdown: ^0.22.14
  unrun: ^0.3.1
  turbo: ^2.10.12
  typescript: ^7.0.2
  vite: ^8.2.2
  vitest: ^4.1.11

# pnpm 11 reads settings from here, not .npmrc — .npmrc keeps registry and auth
# only. It does not warn when it finds them in the old place, so anything left
# behind silently stops applying.
autoInstallPeers: true
strictPeerDependencies: false
preferWorkspacePackages: true
saveWorkspaceProtocol: rolling

supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
# pnpm 11 refuses to install anything published in the last 24h
# (minimumReleaseAge defaults to 1440). knip 6.34.0 was published hours before
# this landed. The exemption is pinned to that exact version, so it stops
# applying the moment knip bumps — drop the block then rather than growing it.
minimumReleaseAgeExclude:
  - knip@6.34.0

# pnpm 11 turns an ignored build script into a hard error. lefthook needs its
# postinstall to write the git hooks.
allowBuilds:
  # esbuild's postinstall links the platform binary it cannot work without.
  # Pulled in by vitepress for the docs site; nothing ships it to consumers.
  esbuild: true
  lefthook: true
